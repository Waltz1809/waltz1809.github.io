<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Story Reader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 20px;
            line-height: 1.6;
        }
        .debug-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .success { color: #238636; }
        .error { color: #f85149; }
        .warning { color: #f79708; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2ea043;
        }
        pre {
            background: #21262d;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .log {
            max-height: 300px;
            overflow-y: auto;
            background: #21262d;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🐛 Story Reader Debug Tool</h1>
    <p>Tool này giúp debug các vấn đề với GitHub Pages deployment.</p>

    <div class="debug-section">
        <h2>📂 File Path Testing</h2>
        <button onclick="testPaths()">Test All Paths</button>
        <div id="path-results"></div>
    </div>

    <div class="debug-section">
        <h2>📁 Stories.json Testing</h2>
        <button onclick="testStoriesJson()">Test Stories.json</button>
        <div id="stories-results"></div>
    </div>

    <div class="debug-section">
        <h2>📖 Chapter Loading Test</h2>
        <button onclick="testChapterLoading()">Test Chapter 001</button>
        <div id="chapter-results"></div>
    </div>

    <div class="debug-section">
        <h2>🌐 Environment Info</h2>
        <button onclick="showEnvironmentInfo()">Show Info</button>
        <div id="env-info"></div>
    </div>

    <div class="debug-section">
        <h2>🚀 Test Main Reader</h2>
        <button onclick="testMainReader()">Test Story Reader</button>
        <div id="reader-test-results"></div>
    </div>

    <div class="debug-section">
        <h2>📝 Debug Logs</h2>
        <button onclick="clearLogs()">Clear Logs</button>
        <div id="debug-logs" class="log"></div>
    </div>

    <script>
        const debugLog = document.getElementById('debug-logs');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f85149' : type === 'success' ? '#238636' : type === 'warning' ? '#f79708' : '#f0f6fc';
            debugLog.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message);
        }

        function clearLogs() {
            debugLog.innerHTML = '';
        }

        async function testPaths() {
            const results = document.getElementById('path-results');
            results.innerHTML = '<p>Testing paths...</p>';
            
            const basePaths = [
                '', 
                './', 
                '/',
                '/waltz1809.github.io/',
                './waltz1809.github.io/'
            ];
            
            const testFiles = [
                'data/stories.json',
                'data/marriage/chapter_001.json'
            ];
            
            let html = '<h3>Path Test Results:</h3>';
            
            for (const basePath of basePaths) {
                for (const testFile of testFiles) {
                    const fullPath = basePath + testFile;
                    try {
                        log(`Testing path: ${fullPath}`);
                        const response = await fetch(fullPath);
                        const status = response.ok ? 'success' : 'error';
                        const statusText = response.ok ? '✅ OK' : `❌ ${response.status}`;
                        html += `<div class="${status}">
                            <strong>${fullPath}</strong>: ${statusText}
                        </div>`;
                        log(`${fullPath}: ${response.status}`, status);
                    } catch (error) {
                        html += `<div class="error">
                            <strong>${fullPath}</strong>: ❌ ${error.message}
                        </div>`;
                        log(`${fullPath}: Error - ${error.message}`, 'error');
                    }
                }
            }
            
            results.innerHTML = html;
        }

        async function testStoriesJson() {
            const results = document.getElementById('stories-results');
            results.innerHTML = '<p>Testing stories.json...</p>';
            
            const paths = [
                'data/stories.json',
                './data/stories.json',
                '/data/stories.json'
            ];
            
            for (const path of paths) {
                try {
                    log(`Trying stories path: ${path}`);
                    const response = await fetch(path);
                    
                    if (response.ok) {
                        const data = await response.json();
                        results.innerHTML = `
                            <div class="success">
                                <h3>✅ Success with: ${path}</h3>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                        log(`Stories loaded successfully from: ${path}`, 'success');
                        return;
                    } else {
                        log(`Failed to load from ${path}: ${response.status}`, 'error');
                    }
                } catch (error) {
                    log(`Error with ${path}: ${error.message}`, 'error');
                }
            }
            
            results.innerHTML = '<div class="error">❌ Failed to load stories.json from any path</div>';
        }

        async function testChapterLoading() {
            const results = document.getElementById('chapter-results');
            results.innerHTML = '<p>Testing chapter loading...</p>';
            
            const paths = [
                'data/marriage/chapter_001.json',
                './data/marriage/chapter_001.json',
                '/data/marriage/chapter_001.json'
            ];
            
            for (const path of paths) {
                try {
                    log(`Trying chapter path: ${path}`);
                    const response = await fetch(path);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const content = data.segments?.[0]?.content || 'No content';
                        results.innerHTML = `
                            <div class="success">
                                <h3>✅ Success with: ${path}</h3>
                                <p><strong>Title:</strong> ${data.chapter_title}</p>
                                <p><strong>Segments:</strong> ${data.total_segments}</p>
                                <p><strong>Content Preview:</strong></p>
                                <pre>${content.substring(0, 500)}${content.length > 500 ? '...' : ''}</pre>
                            </div>
                        `;
                        log(`Chapter loaded successfully from: ${path}`, 'success');
                        return;
                    } else {
                        log(`Failed to load chapter from ${path}: ${response.status}`, 'error');
                    }
                } catch (error) {
                    log(`Error loading chapter from ${path}: ${error.message}`, 'error');
                }
            }
            
            results.innerHTML = '<div class="error">❌ Failed to load chapter from any path</div>';
        }

        function showEnvironmentInfo() {
            const results = document.getElementById('env-info');
            const info = {
                'URL': window.location.href,
                'Protocol': window.location.protocol,
                'Host': window.location.host,
                'Pathname': window.location.pathname,
                'User Agent': navigator.userAgent,
                'Screen': `${screen.width}x${screen.height}`,
                'Viewport': `${window.innerWidth}x${window.innerHeight}`,
                'Local Storage': (() => {
                    try {
                        localStorage.setItem('test', 'test');
                        localStorage.removeItem('test');
                        return '✅ Available';
                    } catch (e) {
                        return '❌ Not available';
                    }
                })()
            };
            
            let html = '<h3>Environment Information:</h3>';
            for (const [key, value] of Object.entries(info)) {
                html += `<div><strong>${key}:</strong> ${value}</div>`;
            }
            
            results.innerHTML = html;
            log('Environment info displayed', 'success');
        }

        async function testMainReader() {
            const results = document.getElementById('reader-test-results');
            results.innerHTML = '<p>Testing main reader functionality...</p>';
            
            try {
                log('Testing main reader...', 'info');
                
                // Test create story reader
                log('Creating StoryReader instance...', 'info');
                
                // Test stories loading
                const storiesResponse = await fetch('data/stories.json');
                if (storiesResponse.ok) {
                    const storiesData = await storiesResponse.json();
                    log(`Stories loaded: ${storiesData.stories.length} stories`, 'success');
                    
                    // Test chapter loading
                    const chapterResponse = await fetch('data/marriage/chapter_001.json');
                    if (chapterResponse.ok) {
                        const chapterData = await chapterResponse.json();
                        log(`Chapter loaded: ${chapterData.chapter_title}`, 'success');
                        
                        results.innerHTML = `
                            <div class="success">
                                <h3>✅ Main Reader Test Successful</h3>
                                <p><strong>Stories:</strong> ${storiesData.stories.length} found</p>
                                <p><strong>First Chapter:</strong> ${chapterData.chapter_title}</p>
                                <p><strong>Content Length:</strong> ${chapterData.segments[0].content.length} chars</p>
                                <p><a href="index.html" target="_blank" style="color: #58a6ff;">→ Open Main Reader</a></p>
                            </div>
                        `;
                    } else {
                        throw new Error('Chapter loading failed');
                    }
                } else {
                    throw new Error('Stories loading failed');
                }
            } catch (error) {
                log(`Reader test failed: ${error.message}`, 'error');
                results.innerHTML = `
                    <div class="error">
                        <h3>❌ Main Reader Test Failed</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            log('Debug page loaded', 'success');
            showEnvironmentInfo();
        });
    </script>
</body>
</html>
