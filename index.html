<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Reader - Dark Mode</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Merriweather:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <!-- Story Selection Screen -->
    <div id="story-selection" class="screen active">
        <div class="container">
            <h1 class="app-title">📚 Story Reader</h1>
            <div class="story-grid">
                <div class="story-card" onclick="startReading()">
                    <h3>Marriage Novel - Truyện Hôn Nhân</h3>
                    <div class="story-meta">494 chương • Đang cập nhật</div>
                    <div class="story-description">Một câu chuyện tình yêu đầy cảm động về hành trình tìm lại bản thân và tình yêu đích thực...</div>
                    <div class="story-tags">
                        <span class="tag">Romance</span>
                        <span class="tag">Drama</span>
                        <span class="tag">Modern</span>
                    </div>
                    <div style="margin-top: 1rem;">
                        <button onclick="testChapter()" style="background: #f79708; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem;">🧪 Test Chapter</button>
                        <button onclick="startReading()" style="background: #238636; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">🚀 Bắt đầu đọc</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chapter Selection Screen -->
    <div id="chapter-selection" class="screen">
        <div class="container">
            <div class="header">
                <button class="btn-back" id="back-to-stories">← Về danh sách truyện</button>
                <h2 id="selected-story-title">Story Title</h2>
            </div>
            <div class="chapter-grid" id="chapter-list">
                <!-- Chapters will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Reader Screen -->
    <div id="reader" class="screen">
        <div class="reader-header">
            <button class="btn-back" id="back-to-chapters">← Danh sách chương</button>
            <div class="reader-info">
                <span id="chapter-title">Chapter Title</span>
                <span class="page-indicator" id="page-indicator">1/10</span>
            </div>
            <button class="btn-settings" id="settings-toggle">⚙️</button>
        </div>

        <div class="reader-content">
            <div class="content-wrapper" id="content-wrapper">
                <div class="chapter-content" id="chapter-content">
                    <!-- Chapter content will be loaded here -->
                </div>
            </div>
        </div>

        <div class="reader-controls">
            <button class="nav-btn" id="prev-page" disabled>← Trước</button>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <button class="nav-btn" id="next-page">Tiếp →</button>
        </div>

        <!-- Touch zones for mobile navigation -->
        <div class="touch-zone touch-left" id="touch-left"></div>
        <div class="touch-zone touch-right" id="touch-right"></div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-content">
            <h3>Cài đặt đọc truyện</h3>
            
            <div class="setting-group">
                <label>Cỡ chữ:</label>
                <div class="font-size-controls">
                    <button class="btn-font-size" data-size="14">Nhỏ</button>
                    <button class="btn-font-size active" data-size="16">Vừa</button>
                    <button class="btn-font-size" data-size="18">Lớn</button>
                    <button class="btn-font-size" data-size="20">Rất lớn</button>
                </div>
            </div>

            <div class="setting-group">
                <label>Chế độ màu:</label>
                <div class="theme-controls">
                    <button class="btn-theme active" data-theme="dark">🌙 Tối</button>
                    <button class="btn-theme" data-theme="light">☀️ Sáng</button>
                    <button class="btn-theme" data-theme="sepia">📖 Sepia</button>
                </div>
            </div>

            <div class="setting-group">
                <label>Số từ mỗi trang:</label>
                <div class="words-per-page-controls">
                    <button class="btn-words-per-page" data-words="500">Ít</button>
                    <button class="btn-words-per-page active" data-words="800">Vừa</button>
                    <button class="btn-words-per-page" data-words="1200">Nhiều</button>
                </div>
            </div>

            <button class="btn-close-settings" id="close-settings">Đóng</button>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Đang tải...</p>
    </div>

    <script src="js/reader.js"></script>
</body>
</html>
