<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cache</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #0d1117; color: #f0f6fc; }
        .result { margin: 10px 0; padding: 10px; background: #161b22; border-radius: 6px; }
        button { padding: 10px 20px; margin: 5px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <h1>🔧 GitHub Pages Cache Test</h1>
    <p>Test để kiểm tra cache và sync của GitHub Pages</p>
    
    <button onclick="testStories()">Test stories.json</button>
    <button onclick="testWithCacheBuster()">Test với Cache Buster</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>
    
    <script>
        function addResult(message, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.style.borderLeft = isError ? '4px solid #f85149' : '4px solid #238636';
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        async function testStories() {
            try {
                addResult('🔄 Testing stories.json...');
                const response = await fetch('./data/stories.json');
                const data = await response.json();
                
                addResult(`✅ Loaded ${data.stories.length} stories:`);
                data.stories.forEach(story => {
                    addResult(`📚 ${story.title} - ${story.chapters} chương`);
                });
                
                addResult(`🕐 Response headers: ${response.headers.get('last-modified') || 'N/A'}`);
                
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function testWithCacheBuster() {
            try {
                const timestamp = Date.now();
                addResult(`🔄 Testing với cache buster: ${timestamp}`);
                
                const response = await fetch(`./data/stories.json?v=${timestamp}`);
                const data = await response.json();
                
                addResult(`✅ Cache buster success! ${data.stories.length} stories loaded`);
                data.stories.forEach(story => {
                    addResult(`📚 ${story.title} - ${story.chapters} chương`);
                });
                
            } catch (error) {
                addResult(`❌ Cache buster failed: ${error.message}`, true);
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto test on load
        window.addEventListener('load', () => {
            addResult('🚀 Page loaded, ready to test!');
        });
    </script>
</body>
</html>
